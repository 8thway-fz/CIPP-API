name: Sync fork
on:
  schedule:
    - cron: '0 4 * * 1'  # Jeden Montag um 04:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git fetch upstream
          git merge upstream/master --no-edit
          git push
