name: Sync fork
on:
  schedule:
    - cron: '0 4 * * 1'  # Jeden Montag um 04:00 UTC
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream remote
        run: git remote add upstream https://github.com/KelvinTegelaar/CIPP-API.git
      - name: Fetch upstream
        run: git fetch upstream
        timeout-minutes: 5
      - name: Merge upstream
        run: git merge upstream/master --no-edit --allow-unrelated-histories
        timeout-minutes: 5
      - name: Push changes
        run: git push
        timeout-minutes: 5
